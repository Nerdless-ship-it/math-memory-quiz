<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#17231f" />
    <meta name="description" content="选择百分数与分数，或平方与幂次专项速算测试。" />
    <title>速算训练</title>
    <link rel="icon" href="./home-favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./home.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="速算训练首页">
        <span class="brand-mark home-mark" aria-hidden="true">Σ</span>
        <span>速算训练</span>
      </a>
    </header>

    <main>
      <section class="screen selection-screen" aria-labelledby="selection-title">
        <div class="selection-heading">
          <h1 id="selection-title">选择今天的测试</h1>
          <p>每次完整练习都会覆盖全部题目，交卷后统一查看成绩与错题。</p>
        </div>

        <!-- 科目卡片由 js/subjects-page.js 从 registry.SUBJECTS 渲染，
             不再手写。新增科目只需改注册表 + 加数据文件。 -->
        <div id="subjects"></div>
      </section>

      <section class="dashboard-section" aria-labelledby="dashboard-title">
        <div class="dashboard-inner">
          <div class="dashboard-heading">
            <div>
              <p class="history-label">进展</p>
              <h2 id="dashboard-title">学习看板</h2>
            </div>
            <div class="dashboard-actions">
              <button class="secondary-button" id="export-button" type="button">导出数据</button>
              <button class="secondary-button" id="import-button" type="button">导入数据</button>
              <input id="import-input" type="file" accept="application/json,.json" hidden />
            </div>
          </div>
          <p class="dashboard-note" id="dashboard-note" hidden></p>
          <!-- 打卡 / 趋势 / 弱项三块由 js/dashboard.js 渲染 -->
          <div id="dashboard"></div>
        </div>
      </section>

      <section class="history-section" aria-labelledby="history-title">
        <div class="history-inner">
          <div class="history-heading">
            <div>
              <p class="history-label">测试记录</p>
              <h2 id="history-title">历史成绩</h2>
            </div>
            <div class="history-tabs" role="tablist" aria-label="选择测试类型">
              <button id="history-percent-tab" type="button" role="tab" aria-selected="true" data-history-type="percent">百分数与分数</button>
              <button id="history-powers-tab" type="button" role="tab" aria-selected="false" data-history-type="powers">平方与幂次</button>
            </div>
          </div>

          <div class="history-summary" aria-label="历史统计">
            <div><span>完成次数</span><strong id="history-count">0</strong></div>
            <div><span>最佳正确率</span><strong id="history-best">—</strong></div>
            <div><span>最快用时</span><strong id="history-fastest">—</strong></div>
          </div>

          <div class="history-list" id="history-list"></div>
          <div class="history-empty" id="history-empty">
            <strong>还没有测试记录</strong>
            <span>完成一次测试后，成绩会自动保存在这里。</span>
          </div>
        </div>
      </section>

      <section class="mistakes-section" aria-labelledby="mistakes-title">
        <div class="mistakes-inner">
          <div class="mistakes-heading">
            <div>
              <p class="history-label">复习</p>
              <h2 id="mistakes-title">错题集</h2>
            </div>
            <div class="history-tabs" role="tablist" aria-label="选择错题类型">
              <button id="mistakes-percent-tab" type="button" role="tab" aria-selected="true" data-mistake-type="percent">百分数与分数</button>
              <button id="mistakes-powers-tab" type="button" role="tab" aria-selected="false" data-mistake-type="powers">平方与幂次</button>
            </div>
          </div>

          <div class="mistakes-summary" aria-label="错题统计">
            <span>待复习</span><strong id="mistakes-count">0</strong><span>题</span>
          </div>
          <div class="mistakes-list" id="mistakes-list"></div>
          <div class="mistakes-empty" id="mistakes-empty">
            <strong>还没有错题</strong>
            <span>交卷后，答错的题目会自动收集到这里。</span>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./js/home.js"></script>
  </body>
</html>
